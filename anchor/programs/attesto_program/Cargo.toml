[package]
name = "attesto-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "attesto_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0" }
solana-program = "=2.1.0"

# Mismos pines que prova_program (mismo repo hermano, mismo problema): la
# toolchain SBF de Solana CLI 2.1 trae rustc 1.79, más vieja que el rustc del
# host usado para el build normal. Estas son las últimas versiones de estas
# deps transitivas que aún compilan sin edition2024.
hashbrown = "=0.15.2"
blake3 = "=1.5.5"
proc-macro-crate = "=3.3.0"
indexmap = "=2.7.1"
unicode-segmentation = "=1.12.0"
zeroize = "=1.8.2"        # 1.9.0 requires edition2024
zeroize_derive = "=1.4.3" # 1.5.0 requires edition2024

[dev-dependencies]
anchor-lang = { version = "0.31.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
